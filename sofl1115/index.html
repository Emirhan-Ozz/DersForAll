<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoFL 1115 · Vize Çalışma</title>
<link rel="stylesheet" href="assets/style.css?v=20261113f">
<style id="vt-slide">
@view-transition{navigation:auto}
::view-transition-old(root){animation:.5s cubic-bezier(.65,0,.25,1) both vt-out-l}
::view-transition-new(root){animation:.5s cubic-bezier(.65,0,.25,1) both vt-in-r}
html:active-view-transition-type(back)::view-transition-old(root){animation-name:vt-out-r}
html:active-view-transition-type(back)::view-transition-new(root){animation-name:vt-in-l}
@keyframes vt-out-l{to{transform:translateX(-100%)}}
@keyframes vt-in-r{from{transform:translateX(100%)}}
@keyframes vt-out-r{to{transform:translateX(100%)}}
@keyframes vt-in-l{from{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}}
</style>
<script id="vt-dir">
addEventListener('pagereveal',function(e){if(!e.viewTransition)return;try{var a=navigation.activation;if(!a||!a.from)return;var d=function(u){return new URL(u).pathname.replace(/index\.html$/,'').split('/').filter(Boolean).length};e.viewTransition.types.add(d(a.entry.url)<d(a.from.url)?'back':'forward')}catch(_){}});
</script>
<script src="../phase.js?v=1"></script>
<script>(function(){var t=null;try{t=localStorage.getItem('sofl-theme');}catch(e){}document.documentElement.setAttribute('data-theme',t||'dark');})();</script>
</head>
<body>
<header class="topbar">

    <nav class="tabs" aria-label="Bölümler">
      <a href="#/" data-nav="home">Testler</a>
      <a href="#/kelimeler" data-nav="kelimeler">Kelimeler</a>
      <a href="#/rehber" data-nav="rehber">Rehber</a>
    </nav>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Tema değiştir" title="Açık / koyu tema">◐</button>
  </div>
</header>
<main id="app" class="container"></main>
<script>try{new ResizeObserver(function(e){document.documentElement.style.setProperty("--toph",e[0].target.offsetHeight+"px")}).observe(document.querySelector(".topbar"))}catch(_){}</script>
